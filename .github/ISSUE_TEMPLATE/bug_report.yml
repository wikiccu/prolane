name: Bug report
description: Report a reproducible problem with existing Prolane behavior.
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before filing a report.
        For suspected vulnerabilities, follow the [security policy](https://github.com/wikiccu/prolane/blob/main/SECURITY.md) instead of this form.
        Use synthetic data and remove credentials, personal information, and sensitive traffic from anything you share.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest example and exact commands needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Explain what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the Prolane commit, Go version, and operating system.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Optional sanitized output that helps explain the problem. Do not include secrets or sensitive data.
      render: text
